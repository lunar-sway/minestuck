plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    maven {
        // location of the maven that hosts JEI files
        name = 'Progwml6 maven'
        url = 'https://dvs1.progwml6.com/files/maven/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // maven that contains infiniverse
        url = "https://maven.commoble.net/releases"
        content {
            includeGroup 'net.commoble.infiniverse'
        }
    }
    maven { // Create, Ponder, Flywheel
        url = "https://maven.createmod.net"
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven { // Registrate
        url = "https://maven.ithundxr.dev/snapshots"
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
}

version = project.getProperty('mc_ms_version')
group = 'com.mraof.minestuck'
base {
    archivesName = 'Minestuck'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = "${neo_version}"

    mods {
        minestuck {
            sourceSet sourceSets.main
        }
    }

    parchment {
        minecraftVersion = "${mc_version}"
        mappingsVersion = "${mappings_version}"
    }

    runs {
        client {
            client()
            if (rootProject.findProperty('mc_username') != null) {
                programArguments.addAll('--uuid', rootProject.findProperty('mc_uuid'), '--username', rootProject.findProperty('mc_username'))
            }
        }

        server {
            server()
        }

        gameTestServer {
            type = "gameTestServer"
        }

        data {
            data()
            programArguments.addAll '--mod', 'minestuck', '--all', '--output', file('src/main/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

dependencies {
    // annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

	// http://dvs1.progwml6.com/files/maven
    compileOnly "mezz.jei:jei-${mc_version}-common-api:${mc_jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${mc_jei_version}"
    runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${mc_jei_version}"

    implementation "software.bernie.geckolib:geckolib-neoforge-${mc_gecko_version}"
    implementation "net.commoble.infiniverse:infiniverse-${infiniverse_branch}:${infiniverse_version}"

    // Add the Create mod to runtime to help test mod interactions
    runtimeOnly("com.simibubi.create:create-${mc_version}:${create_version}:slim") { transitive = false }
    runtimeOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${mc_version}:${flywheel_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

sourceSets.main.resources {
    srcDir 'src/main/generated/resources'
}

jar {
    manifest {
        attributes([
                "Specification-Title": "minestuck",
                "Specification-Vendor": "Minestuck Dev Team",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"Minestuck Dev Team",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    exclude '.cache'
}
